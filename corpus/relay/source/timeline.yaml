  - {id: ADR-002, date: "2026-03-04", title: "Front Relay with the API gateway", status: Accepted, decision: D05, author: pavel,
     stale: [{section: Timeouts, decision: D12, since: "2026-05-18"}, {section: Retries, decision: D21, since: "2026-08-24"}]}
  - {id: ADR-003, date: "2026-05-06", title: "Replace DocumentDB with DynamoDB using a single-table design", status: Accepted, decision: D10, author: denis, proposed: "2026-04-08"}
  - {id: ADR-004, date: "2026-04-22", title: "Hybrid IaC: Terraform for networking, CloudFormation for application stacks", status: Accepted, supersedes: ADR-001, decision: D09, author: sergey}
  - {id: ADR-005, date: "2026-06-17", title: "Evaluate EKS and Lambda with two proofs of concept", status: Superseded, superseded_by: ADR-006, decision: D15, author: timur}
  - {id: ADR-006, date: "2026-08-05", title: "Run Relay on Lambda with provisioned concurrency", status: Accepted, supersedes: ADR-005, decision: D17, author: ivan}
  - {id: ADR-007, date: "2026-08-05", title: "Keep Relay on EKS with autoscaling", status: Rejected, decision: D18, author: timur}
  - {id: ADR-008, date: "2026-09-09", title: "Secrets from SSM Parameter Store", status: Accepted, decision: D23, author: yulia}
  - {id: ADR-009, date: "2026-08-26", title: "Retries through SQS with a dead-letter queue", status: Accepted, decision: D21, author: ivan, supersedes_section: {adr: ADR-002, section: Retries}}
