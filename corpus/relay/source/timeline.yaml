pocs:
  - {id: poc-1, name: "PoC-1: DynamoDB single-table vs multi-table", owner: denis, period: ["2026-04-08", "2026-04-30"], reviewed: m-2026-05-04-poc, report: docs/poc-dynamodb-report.md,
     results: {single_table_p99_read_ms: 4, multi_table_p99_read_ms: 11, single_table_cost_delta_pct: -38, documentdb_p99_read_ms: 9}}
  - {id: poc-2, name: "PoC-2: Relay on EKS with autoscaling", owner: timur, period: ["2026-06-22", "2026-07-24"], reviewed: m-2026-07-27-poc, report: docs/poc-eks-report.md,
     results: {p95_s: 0.4, monthly_cost_usd: 6100, ops_effort: "a second platform team"}}
  - {id: poc-3, name: "PoC-3: Relay on Lambda", owner: sergey, handover: {to: ivan, since: "2026-07-13"}, period: ["2026-06-22", "2026-07-24"], reviewed: m-2026-07-27-poc, report: docs/poc-lambda-report.md,
     results: {p95_warm_s: 1.9, p95_cold_s: 3.4, cold_start_s: 1.2, monthly_cost_usd: 3600, cost_delta_vs_eks_pct: -41}}

