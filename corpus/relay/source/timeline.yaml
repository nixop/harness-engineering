# Source of truth for the Relay corpus (lab 5, part 2). Everything under corpus/relay/
# except the hand-written prose in docs/ is generated from this file by
# evals/memory/gen/*.py: ADRs, meeting transcripts (from meetings.yaml),
# memory/decisions.jsonl, people.jsonl, glossary.jsonl, the reference graph
# and the templated part of questions.jsonl.
#
# Dates are ISO strings. Weekly syncs are Mondays. All names and events are
# invented.

product:
  name: Relay
  summary: >
    Relay is the internal webhook delivery service: it accepts delivery
    requests from product services, persists them, and delivers them to
    customer endpoints with signing, timeouts and retries. In 2026 the team
    moves its infrastructure code from Terraform to CloudFormation, fronts it
    with the API gateway, replaces DocumentDB with DynamoDB, runs two
    proofs of concept for compute and migrates from EKS to Lambda.
  period: ["2026-01-12", "2026-10-05"]

teams:
  core:     {name: Relay core,  members: [anna, nikita, ivan]}
  platform: {name: Platform,    members: [pavel, sergey, lena]}
  data:     {name: Data,        members: [denis]}
  office:   {name: Architecture & product, members: [timur, marat, olga, yulia]}

people:
  anna:   {name: Anna Sokolova,  role: Relay core lead,               aliases: [анна, аня, anna]}
  pavel:  {name: Pavel Grishin,  role: platform lead,                 aliases: [паша, павел, pavel]}
  marat:  {name: Marat Yusupov,  role: product owner,                 aliases: [марат, marat]}
  lena:   {name: Lena Kim,       role: SRE,                           aliases: [лена, елена, lena]}
  denis:  {name: Denis Orlov,    role: data engineer,                 aliases: [денис, denis]}
  timur:  {name: Timur Aliev,    role: architect,                     aliases: [тимур, timur]}
  olga:   {name: Olga Petrova,   role: finance partner,               aliases: [оля, ольга, olga]}
  sergey: {name: Sergey Belov,   role: platform engineer,             aliases: [серёжа, сережа, сергей, sergey], joined: "2026-04-06"}
  nikita: {name: Nikita Frolov,  role: backend engineer,              aliases: [никита, nikita], left: "2026-06-01"}
  yulia:  {name: Yulia Tarasova, role: security engineer,             aliases: [юля, юлия, yulia]}
  ivan:   {name: Ivan Melnik,    role: serverless engineer,           aliases: [ваня, иван, ivan], joined: "2026-07-06"}

topics:
  iac:         {name: infrastructure as code, aliases: [терраформ, terraform, клаудформейшн, cloudformation, cfn, стеки, стек, iac]}
  gateway:     {name: API gateway,            aliases: [гейтвей, gateway, апи гейтвей, api gateway, шлюз]}
  timeouts:    {name: gateway timeout,        aliases: [таймаут, таймауты, timeout, integration timeout]}
  retries:     {name: retries,                aliases: [ретраи, повторы, retry, retries, длк, dlq, дед леттер]}
  idempotency: {name: idempotency,            aliases: [идемпотентность, idempotency key, ключ идемпотентности]}
  database:    {name: database,               aliases: [документ дб, documentdb, динамо, dynamodb, dynamo, база, миграция базы, single table, синглтейбл]}
  compute:     {name: compute platform,       aliases: [куб, кубер, кубернетес, kubernetes, eks, лямбда, lambda, серверлес, serverless, пок, poc]}
  slo:         {name: SLO,                    aliases: [сло, slo, p95, бюджет ошибок, error budget]}
  cost:        {name: cost,                   aliases: [стоимость, косты, бюджет, cost, finops, теги, cost center]}
  security:    {name: security,               aliases: [секреты, secrets, ssm, параметр стор, parameter store, ротация]}
  cutover:     {name: cutover,                aliases: [катовер, переключение, переезд, cutover, откат, rollback, ранбук, runbook]}
  ownership:   {name: ownership,              aliases: [владелец, владение, owner, ownership, передача]}

# Terms the writer must normalise. Topic aliases above cover most; these are
# the multi-word ones that ASR mangles in specific ways.
glossary:
  - {canonical: provisioned concurrency, aliases: [провижнд конкаренси, прогретые лямбды, прогрев, provisioned], topic: compute}
  - {canonical: cold start, aliases: [холодный старт, колд старт, cold start], topic: compute}
  - {canonical: single-table design, aliases: [сингл тейбл, одна таблица, single table], topic: database}
  - {canonical: drift detection, aliases: [дрифт, дрифт детекшн, расхождение стека], topic: iac}
  - {canonical: dead-letter queue, aliases: [дед леттер, dlq, длк, очередь ошибок], topic: retries}
  - {canonical: retry budget, aliases: [бюджет ретраев, бюджет повторов], topic: retries}
  - {canonical: integration timeout, aliases: [интеграционный таймаут, таймаут интеграции, таймаут на гейтвее], topic: timeouts}
  - {canonical: nested stack, aliases: [нестед стек, вложенный стек], topic: iac}

# Decisions. `supersedes` points at the decision this one replaces; status is
# derived: superseded if something supersedes it, rejected if marked, else
# active. `meeting` is the meeting id where it was decided (from meetings.yaml).
decisions:
  - {id: D01, date: "2026-01-12", meeting: m-2026-01-12, topic: iac,        owner: pavel,  proposer: pavel, objector: timur,
     text: "Migrate Relay infrastructure code from Terraform to CloudFormation, module by module, finishing by end of Q1", adr: ADR-001}
  - {id: D02, date: "2026-01-26", meeting: m-2026-01-26, topic: slo,        owner: lena,   proposer: lena,
     text: "Delivery SLO: p95 end-to-end delivery latency 2 s over 5 minutes; monthly delivery success rate 99.5%"}
  - {id: D29, date: "2026-02-09", meeting: m-2026-02-09, topic: cost,       owner: olga,   proposer: olga,
     text: "Every Relay AWS resource carries cost-center and env tags; untagged resources fail the CloudFormation lint"}
  - {id: D03, date: "2026-02-09", meeting: m-2026-02-09, topic: iac,        owner: pavel,  proposer: pavel,
     text: "One CloudFormation root stack per environment with nested stacks per component (network, data, compute, gateway)"}
  - {id: D04, date: "2026-02-23", meeting: m-2026-02-23-incident, topic: iac, owner: lena, proposer: lena,
     text: "Manual console changes are frozen; nightly drift detection on every stack with alerts to on-call"}
  - {id: D05, date: "2026-03-02", meeting: m-2026-03-02, topic: gateway,    owner: pavel,  proposer: pavel,
     text: "Front Relay with the API gateway; the gateway and its routes are defined in the gateway nested stack", adr: ADR-002, depends_on: [D03]}
  - {id: D06, date: "2026-03-16", meeting: m-2026-03-16, topic: timeouts,   owner: pavel,  proposer: pavel, objector: anna,
     text: "Gateway integration timeout 10 s on every Relay route"}
  - {id: D30, date: "2026-03-23", meeting: m-2026-03-23, topic: security,   owner: yulia,  proposer: yulia,
     text: "Callers authenticate to the gateway with IAM-signed requests; the old shared API key is retired by 2026-04-30"}
  - {id: D07, date: "2026-03-30", meeting: m-2026-03-30, topic: retries,    owner: nikita, proposer: nikita,
     text: "Retries disabled on POST /deliver at the gateway until idempotency keys exist; read routes may retry twice"}
  - {id: D08, date: "2026-04-06", meeting: m-2026-04-06, topic: database,   owner: denis,  proposer: denis,
     text: "Evaluate DynamoDB as the replacement for DocumentDB with PoC-1 comparing single-table and multi-table designs", adr: ADR-003}
  - {id: D09, date: "2026-04-20", meeting: m-2026-04-20, topic: iac,        owner: pavel,  proposer: sergey, objector: pavel,
     text: "Hybrid IaC: networking (VPC, peering, DNS) stays in Terraform; application stacks are CloudFormation", supersedes: D01, adr: ADR-004}
  - {id: D10, date: "2026-05-04", meeting: m-2026-05-04-poc, topic: database, owner: denis, proposer: denis, objector: timur,
     text: "DynamoDB single-table design, chosen on PoC-1 results (p99 read 4 ms vs 11 ms; 38% lower cost at projected volume)", adr: ADR-003, poc: poc-1}
  - {id: D11, date: "2026-05-18", meeting: m-2026-05-18, topic: idempotency, owner: nikita, proposer: nikita,
     text: "Idempotency-Key header mandatory on POST /deliver from 2026-06-01; keys kept 24 h; two-week grace period"}
  - {id: D12, date: "2026-05-18", meeting: m-2026-05-18, topic: timeouts,   owner: pavel,  proposer: anna, objector: lena,
     text: "Gateway integration timeout raised from 10 s to 30 s after the slow-target incident of 2026-05-14", supersedes: D06}
  - {id: D13, date: "2026-06-01", meeting: m-2026-06-01, topic: ownership,  owner: anna,   proposer: marat,
     text: "Retries and idempotency ownership moves from Nikita to Anna (Nikita leaves on 2026-06-01)", ownership: {topic: retries, from: nikita, to: anna}}
  - {id: D14, date: "2026-06-15", meeting: m-2026-06-15, topic: retries,    owner: anna,   proposer: anna,
     text: "Retries enabled on POST /deliver at the gateway: max 3 attempts, retry budget 15%", supersedes: D07}
  - {id: D15, date: "2026-06-15", meeting: m-2026-06-15, topic: compute,    owner: timur,  proposer: timur,
     text: "Run two compute PoCs in parallel: EKS with autoscaling (Timur) and Lambda (Sergey); decide on cost and p95 by end of July", adr: ADR-005}
  - {id: D16, date: "2026-07-13", meeting: m-2026-07-13, topic: ownership,  owner: ivan,   proposer: pavel,
     text: "Serverless PoC ownership moves from Sergey to Ivan", ownership: {topic: compute, from: sergey, to: ivan}}
  - {id: D17, date: "2026-08-03", meeting: m-2026-08-03-arch, topic: compute, owner: ivan, proposer: olga, objector: timur,
     text: "Relay moves to Lambda with provisioned concurrency on /deliver; PoC-3 showed 41% lower monthly cost and p95 1.9 s with warm instances", supersedes: D15, adr: ADR-006, poc: poc-3}
  - {id: D18, date: "2026-08-03", meeting: m-2026-08-03-arch, topic: compute, owner: timur, proposer: timur, status: rejected,
     text: "Keep Relay on EKS with autoscaling (rejected: p95 0.4 s but 1.7x the monthly cost and a second platform to run)", adr: ADR-007, poc: poc-2}
  - {id: D19, date: "2026-08-10", meeting: m-2026-08-10, topic: database,   owner: sergey, proposer: marat,
     text: "DynamoDB migration dry run on a production snapshot is owned by Sergey, due 2026-09-04", closes: O1}
  - {id: D20, date: "2026-08-24", meeting: m-2026-08-24, topic: timeouts,   owner: ivan,   proposer: ivan,
     text: "Gateway integration timeout lowered from 30 s to 25 s: the gateway's hard limit is 29 s and Lambda needs headroom", supersedes: D12}
  - {id: D21, date: "2026-08-24", meeting: m-2026-08-24, topic: retries,    owner: anna,   proposer: ivan, objector: anna,
     text: "Retries move out of the gateway into SQS with a dead-letter queue after 5 attempts; gateway retries on /deliver are turned off", supersedes: D14, adr: ADR-009}
  - {id: D22, date: "2026-09-07", meeting: m-2026-09-07-security, topic: ownership, owner: ivan, proposer: anna,
     text: "Retries ownership moves from Anna to Ivan, who owns the SQS pipeline", ownership: {topic: retries, from: anna, to: ivan}}
  - {id: D23, date: "2026-09-07", meeting: m-2026-09-07-security, topic: security, owner: yulia, proposer: yulia,
     text: "Secrets are read from SSM Parameter Store at startup; no secrets in Lambda environment variables or CloudFormation parameters", adr: ADR-008}
  - {id: D24, date: "2026-09-21", meeting: m-2026-09-21, topic: cost,       owner: olga,   proposer: olga,
     text: "Monthly budget alert for Relay production at $4,000, page finance partner and platform lead at 80%"}
  - {id: D25, date: "2026-10-05", meeting: m-2026-10-05-cutover, topic: cutover, owner: ivan, proposer: ivan,
     text: "Serverless cutover on 2026-10-19 at 09:00 local, inside the planned-work error budget"}
  - {id: D26, date: "2026-10-05", meeting: m-2026-10-05-cutover, topic: database, owner: denis, proposer: denis,
     text: "DynamoDB cutover on 2026-10-12, one week before the compute cutover, with dual-write stopped on 2026-10-26"}
  - {id: D27, date: "2026-10-05", meeting: m-2026-10-05-cutover, topic: cutover, owner: lena, proposer: marat,
     text: "Rollback owner for both cutovers is Lena"}
  - {id: D28, date: "2026-10-05", meeting: m-2026-10-05-cutover, topic: slo, owner: lena, proposer: lena, objector: marat,
     text: "Delivery p95 SLO relaxed from 2 s to 3 s for 30 days after the serverless cutover, then back to 2 s", supersedes: D02}

